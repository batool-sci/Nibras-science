<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>مختبر نبراس: اقرأ صيغة المركّب</title>
<link rel="icon" type="image/png" href="favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--n:#05325b;--g:#ffd43a;--l:#cbeafd;--t:#09a5ae;--ok:#1d7a4d;--no:#a33b2b}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#ddf1f8,#f5fdff);color:var(--n);font:18px/1.7 Cairo,Tahoma,sans-serif}
header{background:linear-gradient(180deg,#05325b,#043158);color:#fff;padding:12px 16px;border-bottom:5px solid var(--g);display:flex;align-items:center;gap:12px}
header h1{margin:0;font-size:1.4rem}header img{width:56px;height:56px;flex-shrink:0}
.meta{display:flex;flex-wrap:wrap;gap:2px 16px;font-size:.88rem;color:var(--l)}
main{max-width:860px;margin:0 auto;padding:14px 16px 40px;display:grid;gap:14px}
section{background:#fff;border:1px solid #cfdbe8;border-radius:20px;padding:16px;box-shadow:0 6px 18px #1f386410}
h2{margin:0 0 6px;font-size:1.2rem}.hint{color:#4d6283;font-size:.9rem;margin:4px 0}
.btn{font:inherit;font-weight:700;border:2px solid var(--n);background:#fff;color:var(--n);border-radius:14px;padding:8px 16px;cursor:pointer}
.btn.pri{background:var(--n);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.chip{font:inherit;font-size:.9rem;font-weight:700;border:2px solid #dbe6f1;background:#f3f9fd;color:var(--n);border-radius:999px;padding:4px 14px;cursor:pointer}
.chip.on{background:var(--g);border-color:var(--g)}
.formula{direction:ltr;text-align:center;font:800 2.4rem/1.2 Cairo;margin:8px 0}
.cname{text-align:center;font-weight:700;margin:0}
.bubbles{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;background:var(--l);border-radius:16px;padding:12px;margin:10px 0;direction:ltr}
.at{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:.85rem}
table{width:100%;border-collapse:collapse;margin-top:8px;font-size:.95rem}
th,td{border:1px solid #dbe6f1;padding:6px 8px;text-align:center}th{background:#eef6fb}
.total{background:#fffdf3;border:2px dashed var(--g);border-radius:14px;padding:8px 12px;margin-top:10px;font-weight:700;text-align:center}
.cr{display:flex;align-items:center;gap:10px;border:2px solid #dbe6f1;border-radius:14px;padding:6px 12px;margin:6px 0}
.cr b{flex:1}.cr output{min-width:2ch;text-align:center;font-weight:800;font-size:1.3rem}
.cr button{width:42px;height:42px;border-radius:50%;border:2px solid var(--n);background:#fff;color:var(--n);font:inherit;font-size:1.4rem;font-weight:800;cursor:pointer;line-height:1}
.dot{display:inline-block;width:14px;height:14px;border-radius:50%;margin-inline-end:6px;vertical-align:middle}
.fb{margin-top:10px;padding:10px 14px;border-radius:12px;font-weight:700;min-height:1px}
.fb.ok{background:#e4f5ec;color:var(--ok)}.fb.no{background:#fbebe7;color:var(--no)}
.goal{background:#fffdf3;border:2px dashed var(--g);border-radius:14px;padding:8px 12px;margin:8px 0;text-align:center}
</style></head><body>
<header><img src="logo.png" alt="شعار نبراس العلوم"><div><h1>مختبر نبراس: اقرأ صيغة المركّب</h1>
<div class="meta"><span id="stName"></span><span>الدرس: مركّبات مهمة في حياتنا</span><span>الصف: السابع</span><span>المعلمة: بتول عصام</span></div></div></header>
<main>
<section>
<h2>🔬 اقرأ الصيغة</h2>
<p class="hint">اختر مركّبًا، وانظر كيف تدلّ صيغته على نوع ذرّاته وعددها.</p>
<div class="chips" id="chips"></div>
<p class="cname" id="cn"></p>
<div class="formula" id="fm"></div>
<div class="bubbles" id="bb" aria-label="ذرّات المركّب"></div>
<table><thead><tr><th>العنصر</th><th>الرمز</th><th>عدد الذرّات</th></tr></thead><tbody id="tb"></tbody></table>
<div class="total" id="tt"></div>
</section>
<section>
<h2>🎯 تحدّي البناء</h2>
<p class="hint">اضبط عدد ذرّات كل عنصر ليطابق صيغة المركّب المطلوب، ثم اضغط «تحقّق».</p>
<div class="goal" id="goal"></div>
<div id="ctl"></div>
<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px"><button class="btn pri" id="chk" type="button">تحقّق</button><button class="btn" id="nx" type="button">مركّب آخر</button></div>
<div class="fb" id="fb" aria-live="polite"></div>
</section>
<p><button class="btn" type="button" onclick="location.href='index.html'">↩ العودة إلى الموقع</button></p>
</main>
<script>
const $=s=>document.querySelector(s);
const EL={C:['كربون','#4b5563'],H:['هيدروجين','#2f7fd1'],O:['أكسجين','#d9473b'],N:['نيتروجين','#7a4bd1'],Cl:['كلور','#1d9a5b'],Na:['صوديوم','#d18a1f'],Ca:['كالسيوم','#09a5ae']};
const C=[['الماء','H2O'],['ثاني أكسيد الكربون','CO2'],['ملح الطعام','NaCl'],['رابع كلوريد الكربون','CCl4'],['أكسيد الكالسيوم (الشيد)','CaO'],['الأسبرين','C9H8O4'],['فيتامين C','C6H8O6'],['البروبان (غاز الطبخ)','C3H8'],['الكحول الطبي','C2H6O'],['مزيل طلاء الأظافر','C3H6O'],['سكّر المائدة','C12H22O11']];
const sb=s=>String(s).replace(/\d/g,d=>'₀₁₂₃₄₅₆₇₈₉'[d]);
const ar=n=>n.toLocaleString('ar');
const parse=f=>(f.match(/[A-Z][a-z]?\d*/g)).map(x=>{const m=x.match(/([A-Z][a-z]?)(\d*)/);return[m[1],m[2]?+m[2]:1]});
let nm='';try{nm=localStorage.getItem('nb_name')||''}catch(e){}
const hi=t=>nm?`${nm}، ${t}`:t;
if(nm)$('#stName').textContent='الطالب: '+nm;
function show(i){
  document.querySelectorAll('.chip').forEach((c,j)=>c.classList.toggle('on',i===j));
  const [name,f]=C[i],a=parse(f);
  $('#cn').textContent=name;$('#fm').textContent=sb(f);
  $('#bb').innerHTML=a.map(([s,n])=>Array.from({length:n},()=>`<span class="at" style="background:${EL[s][1]}">${s}</span>`).join('')).join('');
  $('#tb').innerHTML=a.map(([s,n])=>`<tr><td>${EL[s][0]}</td><td dir="ltr"><b>${s}</b></td><td>${ar(n)}</td></tr>`).join('');
  const tot=a.reduce((x,y)=>x+y[1],0);
  $('#tt').textContent=`${ar(a.length)} ${a.length===2?'نوعان':'أنواع'} من الذرّات • المجموع ${ar(tot)} ذرّة`;
}
$('#chips').innerHTML=C.map((c,i)=>`<button class="chip" type="button" data-i="${i}">${c[0]}</button>`).join('');
document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>show(+b.dataset.i));
show(0);
let T=0,S={};
function newTask(){
  let k;do{k=Math.floor(Math.random()*C.length)}while(k===T&&C.length>1);T=k;
  S={};Object.keys(EL).forEach(s=>S[s]=0);
  $('#goal').innerHTML=`ابنِ جزيء <b>${C[T][0]}</b>: <span dir="ltr"><b>${sb(C[T][1])}</b></span>`;
  $('#ctl').innerHTML=Object.keys(EL).map(s=>`<div class="cr"><span class="dot" style="background:${EL[s][1]}"></span><b>${EL[s][0]} (<span dir="ltr">${s}</span>)</b><button type="button" data-s="${s}" data-d="-1" aria-label="إنقاص">−</button><output id="o_${s}">٠</output><button type="button" data-s="${s}" data-d="1" aria-label="زيادة">+</button></div>`).join('');
  $('#ctl').querySelectorAll('button').forEach(b=>b.onclick=()=>{const s=b.dataset.s;S[s]=Math.max(0,Math.min(14,S[s]+ +b.dataset.d));$('#o_'+s).textContent=ar(S[s]);$('#fb').textContent='';$('#fb').className='fb'});
  $('#fb').textContent='';$('#fb').className='fb';
}
$('#chk').onclick=()=>{
  const want={};parse(C[T][1]).forEach(([s,n])=>want[s]=n);
  const bad=Object.keys(EL).filter(s=>(want[s]||0)!==S[s]);
  const f=$('#fb');
  if(!bad.length){f.className='fb ok';f.textContent=hi('أحسنت! بنيتَ المركّب بشكل صحيح 🌟')}
  else{f.className='fb no';f.textContent=hi('راجع عدد ذرّات: '+bad.map(s=>EL[s][0]).join('، ')+'. الرقم الصغير أسفل الرمز هو عدد الذرّات، وغيابه يعني ذرّة واحدة.')}
};
$('#nx').onclick=newTask;
newTask();
</script></body></html>
